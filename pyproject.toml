[tool.ruff]
line-length = 100
target-version = "py311"
# 只格式化 Python 源码：文档（含代码块）与数据样本不纳入 ruff 范围
exclude = [".venv", "web", "node_modules", "*.md", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests", "engine"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
