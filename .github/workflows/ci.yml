name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（lint + 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖（使用锁定版本）
        run: pip install -r requirements-lock.txt
      - name: 代码风格
        run: |
          ruff check .
          ruff format --check .
      - name: 测试
        run: python -m pytest

  frontend:
    name: 前端（类型 + 测试 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 测试
        run: npm test -- --run
      - name: 构建
        run: npm run build
